<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#101114" />

    <meta name="description" content="Application de covoiturage entre collègues" />
    <link rel="stylesheet" href="styles.css" />
  </head>

      <div class="brand-lockup">

    <main>

      <div id="app-root"></div>

    <!-- External libraries (CDN). In production you can add SRI and crossorigin attributes. -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Main application script (must be added to the repo alongside styles.css) -->
